# Limites da camada de economia (percentual do maior entre a janela de 5 h e a semanal)
AMARELO=50
VERMELHO=80
# Contexto da conversa a partir do qual sugerir /clear ou /compact: em tokens (preferido) e em % (reserva)
CONTEXTO_ALTO_TOKENS=120000
CONTEXTO_ALTO=60
# Aparador de saída do Bash (aparar.sh): acima de APARAR_LINHAS, mantém cabeça, erros e cauda. 0 desliga
APARAR_LINHAS=120
# Guarda de leitura (ler.sh): Read de código com LER_MIN_LINHAS ou mais lê só LER_LIMITE linhas. 0 desliga
LER_MIN_LINHAS=600
LER_LIMITE=400
